apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ekt-ecard.fullname" . }}-ecard-chat-postgres
  labels:
    app: {{ include "ekt-ecard.name" . }}-ecard-chat-postgres
spec:
  replicas: {{ .Values.ecardChatPostgres.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ekt-ecard.name" . }}-ecard-chat-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ include "ekt-ecard.name" . }}-ecard-chat-postgres
        io.kompose.network/helmcharts-ecard-network: "true"
    spec:
      containers:
        - name: ecard-chat-postgres
          image: "{{ .Values.ecardChatPostgres.image }}"
          ports:
            - containerPort: {{ .Values.ecardChatPostgres.containerPort }}
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.ecardChatPostgres.env.POSTGRES_DB }}"
            - name: POSTGRES_USER
              value: "{{ .Values.ecardChatPostgres.env.POSTGRES_USER }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.ecardChatPostgres.env.POSTGRES_PASSWORD }}"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "ekt-ecard.fullname" . }}-ecard-chat-postgres-pvc
      restartPolicy: Always

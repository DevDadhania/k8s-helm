apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ekt-ecard.fullname" . }}-ecard-app-redis-pvc
  labels:
    app: {{ include "ekt-ecard.name" . }}-ecard-app-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ecardAppRedis.storage }}

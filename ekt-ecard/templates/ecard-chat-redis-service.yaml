apiVersion: v1
kind: Service
metadata:
  name: {{ include "ekt-ecard.fullname" . }}-ecard-chat-redis
  labels:
    app: {{ include "ekt-ecard.name" . }}-ecard-chat-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.ecardChatRedis.servicePort }}
      targetPort: {{ .Values.ecardChatRedis.containerPort }}
  selector:
    app: {{ include "ekt-ecard.name" . }}-ecard-chat-redis

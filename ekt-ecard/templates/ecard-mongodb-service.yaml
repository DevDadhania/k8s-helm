apiVersion: v1
kind: Service
metadata:
  name: {{ include "ekt-ecard.fullname" . }}-ecard-mongodb
  labels:
    app: {{ include "ekt-ecard.name" . }}-ecard-mongodb
spec:
  type: ClusterIP
  ports:
    - name: mongodb
      port: {{ .Values.ecardMongodb.port }}
      targetPort: {{ .Values.ecardMongodb.containerPort }}
  selector:
    app: {{ include "ekt-ecard.name" . }}-ecard-mongodb

apiVersion: v1
kind: Service
metadata:
  name: {{ include "ekt-ecard.fullname" . }}-ecard-app-postgres
  labels:
    app: {{ include "ekt-ecard.name" . }}-ecard-app-postgres
spec:
  ports:
    - name: postgres
      port: {{ .Values.ecardAppPostgres.port }}
      targetPort: {{ .Values.ecardAppPostgres.port }}
  selector:
    app: {{ include "ekt-ecard.name" . }}-ecard-app-postgres
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ecard-tempo
  labels:
    app: {{ .Release.Name }}-ecard-tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ecard-tempo
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ecard-tempo
    spec:
      containers:
        - name: ecard-tempo
          image: grafana/tempo:2.2.2
          command:
            - "-config.file=/etc/tempo.yaml"
          ports:
            - containerPort: 3100
              name: tempo
            - containerPort: 9411
              name: zipkin
          volumeMounts:
            - mountPath: /etc/tempo.yaml
              name: tempo-config
              subPath: tempo.yaml
              readOnly: true
            - mountPath: /tmp/tempo
              name: ecard-tempo-data
      restartPolicy: Always
      volumes:
        - name: tempo-config
          configMap:
            name: {{ .Release.Name }}-tempo-config
        - name: ecard-tempo-data
          emptyDir: {}

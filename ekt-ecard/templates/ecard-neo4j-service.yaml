apiVersion: v1
kind: Service
metadata:
  name: {{ include "ekt-ecard.fullname" . }}-ecard-neo4j
  labels:
    app: {{ include "ekt-ecard.name" . }}-ecard-neo4j
spec:
  type: ClusterIP
  selector:
    app: {{ include "ekt-ecard.name" . }}-ecard-neo4j
  ports:
    {{- range .Values.ecardNeo4j.ports }}
    - name: port-{{ . }}
      port: {{ . }}
      targetPort: {{ . }}
    {{- end }}
